name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Azure application (client) id is public, so it is a repository variable, not
          # a secret. Without it the build ships with Microsoft sign-in switched off.
          AETHER_MS_CLIENT_ID: ${{ vars.AETHER_MS_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aether Launcher ${{ github.ref_name }}
          releaseBody: |
            Automated cross-platform build for ${{ github.ref_name }}.

            Review the changelog and published checksums before installing.
          releaseDraft: true
          prerelease: false
