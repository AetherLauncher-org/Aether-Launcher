[package]
name = "aether-desktop"
version.workspace = true
description = "Aether Launcher desktop shell"
authors = ["Aether Launcher contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aether-core = { path = "../crates/aether-core" }
aether-auth = { path = "../crates/aether-auth" }
aether-download = { path = "../crates/aether-download" }
aether-launch = { path = "../crates/aether-launch" }
aether-manifest = { path = "../crates/aether-manifest" }
aether-runtime = { path = "../crates/aether-runtime" }
aether-storage = { path = "../crates/aether-storage" }
serde.workspace = true
tauri-plugin-dialog = "2"
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
