# A throwaway comparison of two native UI toolkits (iced, egui), see docs/design/native-ui.md.
# Its own workspace on purpose: it is not part of the launcher's build, the commit checks do not
# compile it, and nothing in the launcher depends on it.
[workspace]
resolver = "2"
members = ["common", "iced", "egui", "slint"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
publish = false

# Fast to build and fast to run: this is for measuring frame times, not for shipping.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = true
